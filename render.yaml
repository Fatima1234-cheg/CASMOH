services:
  - type: web
    name: casmoh-web
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: casmoh
      - key: BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
